# The Clyde service tests tiers 1 to 3. Tier 3 runs the memory Edge Function against Supabase's Postgres. Tier 4 calls real
# models, so it never runs here.
name: harness

on:
  push:
    paths: ['harness/**', 'memory/**', 'plugins/**', '.idx/**', 'scripts/**', '.github/workflows/harness.yml']
  pull_request:
    paths: ['harness/**', 'memory/**', 'plugins/**', '.idx/**', 'scripts/**', '.github/workflows/harness.yml']
  # By hand, tier 3 can run a few files: only = "tenancy plans" runs test/memory/tenancy.test.ts and plans.test.ts.
  workflow_dispatch:
    inputs:
      only:
        description: Tier-3 test files to run, by name without .test.ts, space separated. Empty runs them all.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  node:
    name: Tiers 1 and 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tier 1, worker and workspace tests
        run: npm test

  paseo:
    name: Paseo plugin and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Paseo plugin devDependencies
        run: npm --prefix plugins/paseo ci
      - name: Paseo plugin typecheck and unit tests
        run: npm --prefix plugins/paseo run typecheck && npm --prefix plugins/paseo test
      - name: Paseo runtime test suite
        run: npm --prefix plugins/paseo/runtime test
      - name: Package tarball and verify clean unpack
        run: |
          pkg_dir="$(mktemp -d)"
          tarball="$(cd plugins/paseo && npm pack --pack-destination "$pkg_dir" | tail -n 1)"
          unpack="$pkg_dir/unpacked"
          mkdir -p "$unpack"
          tar -xzf "$pkg_dir/$tarball" -C "$unpack"
          for rel in paseo-plugin.json index.client.tsx index.server.ts runtime/bin/clyde.ts runtime/package.json; do
            test -f "$unpack/package/$rel"
          done
          if grep -rn "@getpaseo/client" "$unpack/package/index.server.ts" "$unpack/package/index.client.tsx" "$unpack/package/server" "$unpack/package/client" "$unpack/package/shared"; then
            echo "Found forbidden @getpaseo/client import in unpacked plugin" >&2
            exit 1
          fi
          node "$unpack/package/runtime/bin/clyde.ts" help >/dev/null
          rm -rf "$pkg_dir"

  memory:
    name: Memory and tier 3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Supabase's own image, for the extensions the migrations need: pgvector, pgroonga, pg_cron and pg_net.
        image: supabase/postgres:17.6.1.011
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MEMORY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      # The full history, because version.test.ts checks that no version's pinned hash ever changed on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache the function's imports
        run: deno cache --node-modules-dir=none harness/test/memory/edge.ts harness/test/memory/database.ts
      - name: The function's unit tests
        if: inputs.only == ''
        run: deno test --allow-env --allow-read --allow-write --allow-run --allow-net=127.0.0.1 --node-modules-dir=none harness/test/memory/*_test.ts
      - name: The eval and research scripts' unit tests
        if: inputs.only == ''
        run: python3 -m unittest memory/eval/test_retrieval_eval.py memory/eval/test_margin_check.py memory/research/test_research.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tier 3, the memory function
        working-directory: harness
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            node --test --test-concurrency=1 $(for t in $ONLY; do printf 'test/memory/%s.test.ts ' "$t"; done)
          else
            npm run test:memory
          fi
