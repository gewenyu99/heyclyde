# The clyde harness tiers 1 to 3. Tier 3 runs the memory Edge Function against Supabase's Postgres. Tier 4 calls real
# models, so it never runs here.
name: harness

on:
  push:
    paths: ['harness/**', 'memory/**', 'skills/**', 'plugins/**', '.claude-plugin/**', '.github/workflows/harness.yml']
  pull_request:
    paths: ['harness/**', 'memory/**', 'skills/**', 'plugins/**', '.claude-plugin/**', '.github/workflows/harness.yml']

permissions:
  contents: read

jobs:
  node:
    name: Tiers 1 and 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Tier 1, unit and flow
        run: npm test
      - name: Tier 2, pi with a fake model
        run: npm run test:pi

  memory:
    name: Memory and tier 3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Supabase's own image, for the extensions the migrations need: pgvector, pgroonga, pg_cron and pg_net.
        image: supabase/postgres:17.6.1.011
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MEMORY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      # The full history, because version.test.ts checks that no version's pinned hash ever changed on main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Cache the function's imports
        run: deno cache --node-modules-dir=none harness/test/memory/edge.ts harness/test/memory/database.ts
      - name: The function's unit tests
        run: deno test --allow-env --allow-read --node-modules-dir=none harness/test/memory/*_test.ts
      - name: The eval and research scripts' unit tests
        run: python3 -m unittest memory/eval/test_retrieval_eval.py memory/research/test_research.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: harness
      - name: Tier 3, the memory function
        working-directory: harness
        run: npm run test:memory
