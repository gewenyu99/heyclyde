# Manual fallback deploy for the memory-proxy Cloudflare Worker (heyclyde.me and memory.heyclyde.me).
# Pushes to main touching memory/proxy/* or memory/design/* auto-deploy via Cloudflare Workers Builds.
# Manual runs require repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy-proxy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-proxy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy memory-proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Site and design checks
        run: deno test --allow-env --allow-read --node-modules-dir=none harness/test/memory/site_test.ts harness/test/memory/design_test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy memory-proxy Worker
        working-directory: memory/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            msg="Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub repository secrets to deploy memory-proxy."
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::$msg" >&2
              exit 1
            fi
            echo "::warning::$msg Skipping deploy until secrets are set."
            exit 0
          fi
          npx --yes wrangler@4 deploy
          curl -fsSI https://heyclyde.me/ >/dev/null
