  const cur=route()==="detail"?"memories":route();
  $("#nav").innerHTML=NAV.map(g=>`<div class="group">${g.g}</div>`+g.items.map(([k,l])=>{
    const c=k==="memories"?`<span class="count">${M.length}</span>`:k==="quests"?`<span class="count">${QUESTS.filter(q=>q.state!=="done").length}</span>`:"";
    return `<a class="navrow${k===cur?" selected":""}" href="#${k}">${l}${c}</a>`}).join("")).join("");

function chart(m){
  const pts=[0.5,0.55,0.6,0.58,0.66,0.72,0.75,m.conf-0.05,m.conf].map((v,i)=>[i,Math.max(0.05,Math.min(0.99,m.state==="superseded"?0.8-i*0.06:v))]);
  const W=320,H=110,px=x=>32+x*(W-44)/8,py=y=>H-22-y*(H-34);
  const d=pts.map(([x,y],i)=>(i?"L":"M")+px(x).toFixed(1)+" "+py(y).toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Confidence history" style="width:100%;max-width:420px;height:auto">
   ${[0,0.5,1].map(t=>`<line x1="32" x2="${W-12}" y1="${py(t)}" y2="${py(t)}" stroke="var(--line)"/><text x="26" y="${py(t)+3}" font-size="9" fill="var(--muted)" text-anchor="end">${t*100}%</text>`).join("")}
   <path d="${d} L ${px(8)} ${py(0)} L ${px(0)} ${py(0)} Z" fill="var(--blue-soft)"/>
   <path d="${d}" fill="none" stroke="var(--blue)" stroke-width="1.6"/>
   <circle cx="${px(last[0])}" cy="${py(last[1])}" r="3.5" fill="var(--blue)"/>
   <text x="${px(0)}" y="${H-6}" font-size="9" fill="var(--muted)">Written</text>
   <text x="${px(8)}" y="${H-6}" font-size="9" fill="var(--muted)" text-anchor="end">Today</text></svg>`;
}

const KCOL={decision:"var(--blue)",preference:"var(--purple)",observation:"var(--muted)",fact:"var(--green)",plan:"var(--amber)",reference:"var(--teal)"};
let LAYOUT=null;
function layout(){
  const W=680,H=440,n=M.length;let P=M.map((m,i)=>({x:W/2+Math.cos(i*2.4)*(60+i*7),y:H/2+Math.sin(i*2.4)*(50+i*6),vx:0,vy:0}));
  const pc={};PROJECTS.forEach((p,i)=>pc[p]=[120+i*110,i%2?150:290]);
  for(let it=0;it<320;it++){
    for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d2=Math.max(80,dx*dx+dy*dy),f=1600/d2;P[i].vx+=dx*f/40;P[i].vy+=dy*f/40;P[j].vx-=dx*f/40;P[j].vy-=dy*f/40}
    LINKS.forEach(([a,b])=>{if(!P[a]||!P[b])return;const dx=P[b].x-P[a].x,dy=P[b].y-P[a].y;P[a].vx+=dx*0.012;P[a].vy+=dy*0.012;P[b].vx-=dx*0.012;P[b].vy-=dy*0.012});
    P.forEach((p,i)=>{const c=pc[M[i].project];p.vx+=(c[0]-p.x)*0.01;p.vy+=(c[1]-p.y)*0.01;p.x+=p.vx;p.y+=p.vy;p.vx*=0.6;p.vy*=0.6;p.x=Math.max(30,Math.min(W-30,p.x));p.y=Math.max(30,Math.min(H-30,p.y))});
  }
  return P;
}

  <div class="graph-wrap"><svg viewBox="0 0 680 440" role="img" aria-label="Memory graph">
   ${LINKS.map(([a,b,t])=>P[a]&&P[b]?`<line x1="${P[a].x}" y1="${P[a].y}" x2="${P[b].x}" y2="${P[b].y}" stroke="${t==="contradicts"?"var(--amber)":"var(--line-strong)"}" stroke-width="1.2" ${t==="contradicts"?'stroke-dasharray="4 3"':""} opacity="${on(M[a])&&on(M[b])?1:0.15}"/>`:"").join("")}

function fmt(v,u){return u==="$"?"$"+v.toFixed(2):u?v.toFixed(1)+" "+u:v.toLocaleString()}
function vBilling(){
  const seg=`<div class="seg" role="group" aria-label="Plan view">${[["free","Free"],["clyde","Clyde"],["owner","Owner"]].map(([k,l])=>`<button aria-pressed="${S.plan===k}" data-plan="${k}">${l}</button>`).join("")}</div>`;
  let body="";
  if(S.plan==="clyde"){
    const over=0.6*0.21;
    body=`<div class="grid2"><div class="card"><h2>Your plan</h2><div class="row" style="margin-top:8px;align-items:baseline"><span class="big">$9.99</span><span class="subtle">per month, renews Dec 1</span></div><p class="subtle" style="margin-top:6px">One plan. It covers the allowances below. Use past them is billed at cost plus a fixed 50% margin, at the end of the month.</p></div>
     <div class="card"><h2>This month</h2><div class="row" style="margin-top:8px;align-items:baseline"><span class="big">$${(9.99+over).toFixed(2)}</span><span class="subtle">projected</span></div><p class="subtle" style="margin-top:6px">$9.99 plan plus $${over.toFixed(2)} of egress over the allowance.</p></div></div>
     <div class="section"><h2>Included this month</h2><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Meter</th><th>Included</th><th>Used</th><th style="width:28%">Of allowance</th><th>Past the allowance</th></tr></thead><tbody>
     ${METERS.map(m=>{const p=Math.min(100,m[2]/m[3]*100);return `<tr><td><b>${m[0]}</b></td><td>${m[1]}</td><td class="num">${fmt(m[2],m[4])}</td><td><div class="bar${m[2]>m[3]?" warn":""}"><span style="width:${p}%"></span></div><span class="subtle" style="font-size:11px">${Math.round(m[2]/m[3]*100)}%</span></td><td>${m[5][0]}</td></tr>`}).join("")}
     </tbody></table></div></div>
     <div class="section card"><h2>Usage spend limit</h2><p class="subtle" style="margin:6px 0 10px">Usage past the allowance stops at this amount each month. Reads keep working.</p><div class="row"><input type="range" id="spend" min="0" max="500" step="5" value="${S.spend}" style="flex:1;min-width:160px" aria-label="Usage spend limit"><b id="spendv" class="num" style="min-width:56px">$${S.spend}</b></div></div>
     <div class="section"><h2>Invoices</h2><div class="list" style="margin-top:10px">${[["Nov 1, 2026","$10.14","Paid"],["Oct 1, 2026","$9.99","Paid"]].map(r=>`<div class="item" style="cursor:default"><div class="t">${r[0]}</div><div class="r num">${r[1]}</div><div class="m"><span class="status-ok">${r[2]}</span></div><div class="r">Receipt from Polar</div></div>`).join("")}</div><p class="subtle" style="margin-top:10px;font-size:11.5px">Billed by Polar, the merchant of record. Polar handles tax, receipts and refunds.</p></div>`;
  }else if(S.plan==="free"){
    const L=[["Memories","64 of 100"],["Artifacts","None on Free"],["Recalls","212 of 300 this month"],["Writes","31 of 50 this month"],["Apps","2 of 2"],["Agents","2 of 2"],["Quest board","Clyde plan"],["Learning","Clyde plan"]];
    body=`<div class="notice amber">You're one of the first 1,000 people on Clyde, so you have a free allocation. It doesn't renew into a bill. Upgrade when you outgrow it.</div>
    <div class="grid3 section">${L.map(l=>`<div class="card"><h2>${l[0]}</h2><div style="font-size:16px;font-weight:650;margin-top:6px">${l[1]}</div></div>`).join("")}</div>
    <div class="section"><button class="btn primary" id="upgrade">Upgrade to Clyde, $9.99/month</button> <span class="subtle" id="upmsg"></span></div>`;
  }else{
    body=`<div class="card"><h2>Owner plan</h2><div style="font-size:16px;font-weight:650;margin:6px 0">No limits. No billing.</div><p class="subtle">The owner account. Every meter still counts, so you can see what Clyde costs to run.</p></div>
    <div class="section"><h2>This month, at cost</h2><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Meter</th><th>Used</th><th>Cost to run</th></tr></thead><tbody>${[["AI usage","35M tokens","$3.92"],["Storage","0.01 GB","$0.00"],["Egress","3.6 GB","$0.32"],["Requests","71,400","$0.14"],["Database","0.38 GB","$0.05"]].map(r=>`<tr><td><b>${r[0]}</b></td><td class="num">${r[1]}</td><td class="num">${r[2]}</td></tr>`).join("")}</tbody></table></div></div>`;
  }
  return `<div class="head"><div><div class="eyebrow">Account</div><h1>Usage and billing</h1><p class="subtle">Preview: switch plans to see each view.</p></div>${seg}</div>${body}`;
}
function bindBilling(){
  document.querySelectorAll("[data-plan]").forEach(b=>b.addEventListener("click",()=>{S.plan=b.dataset.plan;renderNav();render()}));
  const r=$("#spend");if(r)r.addEventListener("input",e=>{S.spend=+e.target.value;$("#spendv").textContent="$"+S.spend});
  const u=$("#upgrade");if(u)u.addEventListener("click",()=>{$("#upmsg").textContent="Opens Polar checkout."});
}
function vAccount(){
  return `<div class="head"><div><div class="eyebrow">Account</div><h1>Account</h1></div></div>
  <div class="grid2"><div class="card"><h2>Profile</h2><dl class="kv" style="margin-top:10px"><dt>Email</dt><dd>wen@heyclyde.me</dd><dt>Signed up</dt><dd>Oct 12, 2026</dd><dt>Data region</dt><dd>Canada (Central). Clyde isn't offered in the EU, EEA, UK, Switzerland or Quebec.</dd></dl></div>
  <div class="card"><h2>Sessions</h2><div class="list" style="margin-top:10px">${[["This browser","Toronto, now"],["Safari on iPhone","Toronto, 2 days ago"]].map((s,i)=>`<div class="item" style="cursor:default"><div class="t">${s[0]}</div><div class="r">${i?'<button class="btn small" data-out>Sign out</button>':"Current"}</div><div class="m">${s[1]}</div></div>`).join("")}</div></div></div>
  <div class="section card"><h2>Privacy</h2>
   <div class="toggle"><div><b>Hooks send full prompts</b><div class="subtle" style="font-size:12px">Off: hooks send tool names and timings only. On: the learner reads your prompts to learn from pushback.</div></div><label class="switch"><input type="checkbox" id="hk" aria-label="Hooks send full prompts"><span></span></label></div>
   <div class="toggle"><div><b>New memories are private by default</b><div class="subtle" style="font-size:12px">Private memories reach the AI provider by title only.</div></div><label class="switch"><input type="checkbox" id="pv" aria-label="Private by default"><span></span></label></div>
   <div class="toggle"><div><b>Work memories stay out of personal agents</b><div class="subtle" style="font-size:12px">A personal agent's recall skips memories marked work.</div></div><label class="switch"><input type="checkbox" id="ws" checked aria-label="Separate work and personal"><span></span></label></div>
  </div>
  <div class="section grid2"><div class="card"><h2>Export</h2><p class="subtle" style="margin:6px 0 10px">Every memory, link and artifact as one file.</p><button class="btn" id="exp">Export everything</button><div class="ok" id="expmsg"></div></div>
  <div class="card"><h2>Delete account</h2><p class="subtle" style="margin:6px 0 10px">Deletes every memory, artifact, agent and device. Your subscription ends today.</p>${S.confirm==="acct"?`<div class="notice amber"><p style="margin:0 0 8px">Type <b>delete</b> to confirm. This can't be undone.</p><div class="row"><input type="text" id="delc" aria-label="Type delete"><button class="btn danger solid" id="delgo">Delete account</button><button class="btn" id="delno">Cancel</button></div><div class="err" id="delerr"></div></div>`:`<button class="btn danger" id="del">Delete account</button>`}</div></div>`;
}
function bindAccount(){
  $("#exp").addEventListener("click",()=>{$("#expmsg").textContent="Export started. We'll email the link when it's ready."});
  const d=$("#del");if(d)d.addEventListener("click",()=>{S.confirm="acct";render()});
  const n=$("#delno");if(n)n.addEventListener("click",()=>{S.confirm=null;render()});
  const g=$("#delgo");if(g)g.addEventListener("click",()=>{if($("#delc").value.trim()!=="delete"){$("#delerr").textContent="Type delete to confirm.";return}$("#delerr").className="ok";$("#delerr").textContent="In the real site, this deletes the account. The prototype keeps it."});
  document.querySelectorAll("[data-out]").forEach(b=>b.addEventListener("click",()=>{b.textContent="Signed out";b.disabled=true}));
}
function vSignin(){
  const step=S.signinStep;
  return `<div class="auth"><div class="brand" style="justify-content:center;padding:0"><span class="brand-mark">c</span>clyde</div>
  <div class="card">${step==="email"?`<h1 style="font-size:20px;margin-top:0">Sign in or sign up</h1><p class="subtle">Everything your agents learn, shared by all of them. We email you a code, so there's no password.</p>
   <form id="ef" style="display:grid;gap:8px;margin-top:14px"><label for="em" class="eyebrow">Email</label><input type="email" id="em" placeholder="you@example.com" autocomplete="email"><div class="err" id="eerr"></div><button class="btn primary">Email me a code</button></form>`:
   step==="code"?`<h1 style="font-size:20px;margin-top:0">Check your email</h1><p class="subtle">Enter the 6-digit code we sent. It works for 10 minutes.</p>
   <form id="cf" style="display:grid;gap:10px;margin-top:14px"><div class="otp">${[0,1,2,3,4,5].map(i=>`<input type="text" inputmode="numeric" maxlength="1" id="o${i}" aria-label="Digit ${i+1}">`).join("")}</div><div class="err" id="cerr"></div><button class="btn primary">Continue</button><button type="button" class="btn" id="back">Use another email</button></form>`:
   `<h1 style="font-size:20px;margin-top:0">You're in</h1><p class="subtle">You got one of the first 1,000 free allocations. Connect your first app next.</p><div class="row" style="margin-top:14px"><a class="btn primary" href="#apps" style="text-decoration:none">Connect an app</a><a class="btn" href="#memories" style="text-decoration:none">Browse memories</a></div>`}</div>
  <p class="subtle" style="font-size:11.5px;text-align:center">Clyde isn't offered in the EU, EEA, UK, Switzerland or Quebec. Sign-ups from there are refused and nothing is stored.</p></div>`;
}
function bindSignin(){
  const ef=$("#ef");if(ef)ef.addEventListener("submit",e=>{e.preventDefault();const v=$("#em").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){$("#eerr").textContent="Enter an email address like you@example.com.";return}S.signinStep="code";render();$("#o0").focus()});
  const cf=$("#cf");if(cf){
    document.querySelectorAll(".otp input").forEach((inp,i,all)=>inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"");if(inp.value&&all[i+1])all[i+1].focus();$("#cerr").textContent=""}));
    cf.addEventListener("submit",e=>{e.preventDefault();const c=[...document.querySelectorAll(".otp input")].map(i=>i.value).join("");if(c.length<6){$("#cerr").textContent="Enter all 6 digits.";return}S.signinStep="done";render()});
    $("#back").addEventListener("click",()=>{S.signinStep="email";render()});
  }
}
function vConsent(){
  if(S.consent)return `<div class="auth"><div class="brand" style="justify-content:center;padding:0"><span class="brand-mark">c</span>clyde</div><div class="card"><h1 style="font-size:20px;margin-top:0">${S.consent==="ok"?"Connected":"Refused"}</h1><p class="subtle">${S.consent==="ok"?"Claude can now recall and remember with Clyde. You can close this tab.":"Claude wasn't connected. Nothing was shared."}</p><button class="btn" id="again" style="margin-top:12px">Show the request again</button></div></div>`;
  return `<div class="auth"><div class="brand" style="justify-content:center;padding:0"><span class="brand-mark">c</span>clyde</div>
  <div class="card"><div class="app-top"><span class="app-badge">C</span><h1 style="font-size:20px;margin:0">Claude wants to connect to Clyde</h1></div>
   <dl class="kv" style="margin-top:14px"><dt>App</dt><dd>Claude</dd><dt>Sends you back to</dt><dd class="mono">claude.ai</dd><dt>Signed in as</dt><dd>wen@heyclyde.me</dd></dl>
   <p class="subtle" style="margin-top:12px">Claude will recall and remember notes, and read and post quests. It can't see billing or delete your account.</p>
   <div class="row" style="margin-top:14px"><button class="btn primary" id="appr">Approve</button><button class="btn" id="deny">Deny</button></div>
   <p class="subtle" style="font-size:11.5px;margin-top:12px">Didn't start this? Deny it. Clyde only approves callbacks from apps it knows.</p></div></div>`;
}
function bindConsent(){
  const a=$("#appr");if(a){a.addEventListener("click",()=>{S.consent="ok";render()});$("#deny").addEventListener("click",()=>{S.consent="no";render()})}
  const g=$("#again");if(g)g.addEventListener("click",()=>{S.consent=null;render()});
}
const VIEWS={memories:[vMemories,bindMemories],detail:[vDetail,bindDetail],graph:[vGraph,bindGraph],quests:[vQuests,bindQuests],agents:[vAgents,bindAgents],apps:[vApps,bindApps],billing:[vBilling,bindBilling],account:[vAccount,bindAccount],signin:[vSignin,bindSignin],consent:[vConsent,bindConsent]};
function render(){
  const r=route(),[v,b]=VIEWS[r];
  $("#view").innerHTML=v();b();renderNav();
  document.querySelectorAll("[data-open]").forEach(el=>{const open=()=>{S.sel=+el.dataset.open;S.confirm=null;S.editing=false;go("detail")};el.addEventListener("click",open);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}})});
}
let last=null;
window.addEventListener("hashchange",()=>{const r=route();if(r!==last){S.confirm=null;S.appModal=null;S.newQuest=false}last=r;render();window.scrollTo(0,0)});
last=route();render();
</script>
