/* Layout: a sticky sidebar of filed pages on the left, one working sheet on the right. Under 760px the sidebar becomes a
   tab strip under the wordmark. Everything is built from design/tokens.css and components.css. */
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--cl-paper-0)}
body{margin:0;color:var(--cl-ink);font:var(--cl-text-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--cl-carbon)}
:focus-visible{outline:2px solid var(--cl-carbon);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:28px;max-width:1320px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));align-self:start;display:grid;gap:4px}
.side .cl-wordmark{padding:6px 10px 12px;--cl-logo-h:28px}
.side-foot{margin-top:18px;padding:14px 10px 0;border-top:1px dashed var(--cl-rule-strong);display:grid;gap:4px;font:var(--cl-text-mono);font-size:11.5px;color:var(--cl-ink-3)}
.side-foot b{color:var(--cl-ink);font:600 13px/1.3 var(--cl-font-sans)}
.mtop{display:none}
.main{min-width:0;padding-top:6px}
@media (max-width:760px){
 .shell{grid-template-columns:minmax(0,1fr);gap:0;padding-top:0}
 .side{display:none}
 .mtop{display:grid;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cl-paper-0);padding:12px 0 4px;border-bottom:1px solid var(--cl-rule);margin-bottom:18px}
 .mtop .cl-tabs{padding-left:0}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cl-paper-0)}

/* Page head */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head>div:first-child{display:grid;gap:8px;min-width:0;max-width:720px}
.head .cl-lead{font-size:15px;line-height:23px}
.section{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:36px 0 12px;padding-top:14px;border-top:1px solid var(--cl-rule)}
.section h2{margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;align-items:start}
.muted{color:var(--cl-ink-3)}
.mono{font-family:var(--cl-font-mono);font-size:12px}
.num{font-family:var(--cl-font-mono);font-variant-numeric:tabular-nums}

/* Memories */
.search{display:flex;gap:8px;margin-bottom:10px}
.search .cl-input{flex:1}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-bottom:20px}
.filters .cl-select{height:34px;font-size:13.5px}
.count{font:var(--cl-text-mono);color:var(--cl-ink-3)}
.cl-memory[data-open]{cursor:pointer}

/* Detail */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
@media (max-width:1040px){.detail{grid-template-columns:minmax(0,1fr)}}
.back{display:inline-flex;align-items:center;gap:6px;font:var(--cl-text-mono);color:var(--cl-ink-3);text-decoration:none;margin-bottom:14px}
.back:hover{color:var(--cl-ink)}
.paper{padding:24px 26px;display:grid;gap:16px}
@media (max-width:480px){.paper{padding:20px 18px}}
.paper .body{font:var(--cl-text-body-l);color:var(--cl-ink);max-width:64ch;margin:0}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:9px 12px;margin:0;font:var(--cl-text-small)}
.kv dt{font:var(--cl-text-label);letter-spacing:var(--cl-track-label);text-transform:uppercase;color:var(--cl-ink-3);padding-top:3px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.aside{display:grid;gap:16px}
.aside .cl-card{display:grid;gap:12px}
.file-row,.link-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-top:1px dashed var(--cl-rule)}
.file-row:first-of-type,.link-row:first-of-type{border-top:0;padding-top:2px}
.file-row b,.link-row b{font-weight:600;overflow-wrap:anywhere}
.file-row>span,.link-row>span{grid-column:1/-1;font:var(--cl-text-small);color:var(--cl-ink-3)}
.link-row b{cursor:pointer;color:var(--cl-ink)}
.link-row b:hover{color:var(--cl-carbon)}
.confirm{padding:18px 20px;display:grid;gap:12px;border-color:var(--cl-bad)}
.confirm.neutral{border-color:var(--cl-rule-strong)}
.chart{width:100%;height:auto;display:block}
.chart .grid-l{stroke:var(--cl-rule);stroke-width:1}
.chart .ax{fill:var(--cl-ink-3);font:10px var(--cl-font-mono)}
.chart .ln{fill:none;stroke:var(--cl-carbon);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--cl-carbon-wash)}
.chart .pt{fill:var(--cl-carbon);stroke:var(--cl-paper-1);stroke-width:2}

/* Graph */
.graph{overflow:hidden;padding:0}
.graph svg{display:block;width:100%;height:auto;background:var(--cl-paper-1)}
.graph .edge{stroke:var(--cl-rule-strong);stroke-width:1.2}
.graph .edge.contradicts{stroke:var(--cl-warn);stroke-dasharray:4 3;stroke-width:1.6}
.graph .edge.supports{stroke:var(--cl-ink-3)}
.graph .node{cursor:pointer}
.graph .node circle{fill:var(--cl-paper-1);stroke:var(--pen);stroke-width:2}
.graph .node.settled circle{fill:var(--pen)}
.graph .node.dim{opacity:.18}
.graph .node:hover circle,.graph .node:focus circle{stroke-width:3.5}
.graph .node:focus{outline:none}
.graph text{font:600 10.5px var(--cl-font-sans);fill:var(--cl-ink)}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:12px}

/* Quests */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:minmax(0,1fr)}}
.lane{display:grid;gap:12px;align-content:start;padding:12px;border-radius:var(--cl-radius-lg);background:var(--cl-paper-2);--cl-quest-ground:var(--cl-paper-2)}
.lane-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.lane .cl-quest{box-shadow:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.qform{padding:22px;display:grid;gap:14px;margin-bottom:22px}
.qform .grid3{gap:12px}

/* Agents */
.member{display:grid;gap:14px;padding:18px}
.member .cl-agent__sq{width:36px;height:36px;font-size:13px}
.member .cl-agent__name{font-size:16px}
.device{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 0;border-top:1px dashed var(--cl-rule-strong)}
.device:first-child{border-top:0}

/* Apps */
.app{display:grid;gap:14px;padding:18px}
.app-head{display:flex;align-items:center;gap:12px;min-width:0}
.app-head>div{min-width:0}
.glyph{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1.5px solid var(--cl-ink);border-radius:var(--cl-radius-sm);font:700 13px/1 var(--cl-font-mono);background:var(--cl-paper-1)}
.app-head .cl-chip,.app-head .cl-state{margin-left:auto}
.modal{padding:24px;display:grid;gap:14px;max-width:520px;margin:0 0 24px}

/* Billing */
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--cl-rule-strong);border-radius:var(--cl-radius-md);background:var(--cl-paper-1)}
.seg button{appearance:none;border:0;background:transparent;padding:6px 12px;border-radius:5px;font:600 13px/1 var(--cl-font-sans);color:var(--cl-ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cl-ink);color:var(--cl-on-ink)}
.plan{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:20px}
@media (max-width:860px){.plan{grid-template-columns:minmax(0,1fr)}}
.plan .cl-card{display:grid;gap:10px;padding:20px}
.big{font:700 40px/1 var(--cl-font-mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.meters{display:grid;gap:0}
.meter{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;border-top:1px dashed var(--cl-rule)}
.meter:first-child{border-top:0}
.meter .bar{grid-column:1/-1;height:8px;border-radius:2px;background:var(--cl-paper-2);overflow:hidden;display:flex}
.meter .bar i{display:block;height:100%;background:var(--cl-ink)}
.meter .bar i.over{background:var(--cl-warn)}
.meter small{grid-column:1/-1;font:var(--cl-text-small);color:var(--cl-ink-3)}
.table-wrap{overflow-x:auto;border:1px solid var(--cl-rule);border-radius:var(--cl-radius-lg);background:var(--cl-paper-1)}
table{border-collapse:collapse;width:100%;min-width:520px;font:var(--cl-text-small)}
th,td{text-align:left;padding:11px 14px;border-top:1px solid var(--cl-rule);vertical-align:top}
th{border-top:0;font:var(--cl-text-label);letter-spacing:var(--cl-track-label);text-transform:uppercase;color:var(--cl-ink-3)}
td.n,th.n{text-align:right;font-family:var(--cl-font-mono);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--cl-ink)}

/* Account */
.toggle{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:14px 0;border-top:1px dashed var(--cl-rule)}
.toggle:first-child{border-top:0;padding-top:0}
.toggle p{margin:3px 0 0;font:var(--cl-text-small);color:var(--cl-ink-3)}
.switch{position:relative;width:36px;height:20px;flex:none;margin-top:2px}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:4px;border:1.5px solid var(--cl-edge);background:var(--cl-paper-1);transition:background var(--cl-dur-2) var(--cl-ease-out)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:2px;background:var(--cl-ink-3);transition:transform var(--cl-dur-2) var(--cl-ease-out),background var(--cl-dur-2)}
.switch input:checked+span{background:var(--cl-ink);border-color:var(--cl-ink)}
.switch input:checked+span::after{transform:translateX(16px);background:var(--cl-on-ink)}
.switch input:focus-visible+span{box-shadow:var(--cl-focus)}

/* Sign-in and consent: the same ticket as memory.heyclyde.me */
.flow{display:grid;justify-items:center;padding:12px 0 24px}
.ticket{width:100%;max-width:460px;overflow:hidden}
.ticket-head{display:flex;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1.5px dashed var(--cl-rule-strong)}
.ticket-body{display:grid;gap:14px;padding:26px 28px 28px;grid-template-columns:minmax(0,1fr)}
@media (max-width:480px){.ticket-body{padding:22px 20px}}
.ticket form{grid-template-columns:minmax(0,1fr)}.ticket-body>*{min-width:0}
.ticket .cl-stamp{justify-self:start;font-size:14px;padding:7px 12px 6px}
.badge{width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--cl-rule-strong);border-radius:var(--cl-radius-md);background:var(--cl-paper-1);color:var(--cl-ink-2);box-shadow:var(--cl-copy-1)}
.badge svg{width:22px;height:22px}
.otp{display:flex;gap:6px}
.otp .cl-input{width:44px;height:50px;padding:0;text-align:center;font:600 20px/1 var(--cl-font-mono)}
.perm{margin:0;padding:0;list-style:none;display:grid;gap:8px;font:var(--cl-text-small);color:var(--cl-ink-2)}
.perm li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}
.perm li::before{content:"+";font:700 13px/19px var(--cl-font-mono);color:var(--cl-ok)}
.perm li.no::before{content:"−";color:var(--cl-bad)}
.flow-note{max-width:460px;margin:16px 0 0;font:var(--cl-text-small);color:var(--cl-ink-3);text-align:center}

/* Toasts */
.toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toasts .cl-toast{pointer-events:auto}
</style>

let LAYOUT=null;
function layout(){
 const W=720,H=440,n=M.length;let P=M.map((m,i)=>({x:W/2+Math.cos(i*2.4)*(60+i*7),y:H/2+Math.sin(i*2.4)*(50+i*6),vx:0,vy:0}));
 const pc={};PROJECTS.forEach((p,i)=>pc[p]=[120+i*120,i%2?150:290]);
 for(let it=0;it<320;it++){
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d2=Math.max(80,dx*dx+dy*dy),f=1600/d2;P[i].vx+=dx*f/40;P[i].vy+=dy*f/40;P[j].vx-=dx*f/40;P[j].vy-=dy*f/40}
  LINKS.forEach(([a,b])=>{if(!P[a]||!P[b])return;const dx=P[b].x-P[a].x,dy=P[b].y-P[a].y;P[a].vx+=dx*0.012;P[a].vy+=dy*0.012;P[b].vx-=dx*0.012;P[b].vy-=dy*0.012});
  P.forEach((p,i)=>{const c=pc[M[i].project];p.vx+=(c[0]-p.x)*0.01;p.vy+=(c[1]-p.y)*0.01;p.x+=p.vx;p.y+=p.vy;p.vx*=0.6;p.vy*=0.6;p.x=Math.max(30,Math.min(W-30,p.x));p.y=Math.max(30,Math.min(H-30,p.y))});
 }
 return P;
}

function qcard(q){
 const stamp=q.state==="claimed"?`<span class="cl-stamp cl-stamp--carbon">Claimed <small>${q.by} · ${q.lease.replace(" left","")}</small></span>`:q.state==="done"?`<span class="cl-stamp cl-stamp--ok">Done <small>${q.by}</small></span>`:`<span class="cl-chip">Open</span>`;
 return `<article class="cl-quest${q.state==="done"?" is-done":""}"><div class="cl-quest__stub"><span class="cl-label">Nº</span><span class="cl-quest__no">${q.id}</span><span class="cl-quest__pri${q.pri==="high"?" is-high":""}">${q.pri}</span></div>
 <div class="cl-quest__main"><div class="cl-quest__head"><h3 class="cl-quest__title">${esc(q.title)}</h3>${stamp}</div>
 ${q.state!=="done"?`<p class="cl-quest__brief">${esc(q.brief)}</p><div class="cl-quest__done"><span class="cl-label">Done when</span>${esc(q.dw)}</div>`:""}
 <span class="cl-quest__for">for <b>${q.type} agent</b> · ${esc(q.env)}</span></div></article>`;
}
function vQuests(){
 const form=S.newQuest?`<form class="cl-sheet qform" id="qform"><h2 class="cl-title-3">Post a quest</h2>
 <div class="cl-field"><label for="qt">Title</label><input class="cl-input" id="qt" placeholder="Compare halfvec recall quality"></div>
 <div class="cl-field"><label for="qb">Brief</label><textarea class="cl-textarea" id="qb" placeholder="What to do, and where the details are."></textarea></div>
 <div class="cl-field"><label for="qd">Done when</label><input class="cl-input" id="qd" placeholder="The check that proves it's finished"></div>
 <div class="grid3"><div class="cl-field"><label for="qy">Agent type</label><select class="cl-select" id="qy">${["coding","exploration","research","review","ops"].map(x=>`<option>${x}</option>`).join("")}</select></div>
 <div class="cl-field"><label for="qm">Machine</label><select class="cl-select" id="qm"><option>any machine</option>${MACHINES.map(x=>`<option>${x}</option>`).join("")}</select></div>
 <div class="cl-field"><label for="qc">Context</label><select class="cl-select" id="qc"><option>work</option><option>personal</option></select></div>
 <div class="cl-field"><label for="qp">Priority</label><select class="cl-select" id="qp"><option>normal</option><option>high</option><option>low</option></select></div></div>
 <p class="cl-error" id="qerr"></p><div class="row"><button class="cl-btn cl-btn--primary" type="submit">Post quest</button><button class="cl-btn cl-btn--ghost" type="button" id="qcancel">Cancel</button></div></form>`:"";
 const lane=(s,l)=>{const qs=QUESTS.filter(q=>q.state===s);return `<section class="lane" aria-label="${l}"><div class="lane-head"><h2 class="cl-label">${l}</h2><span class="count">${qs.length}</span></div>${qs.map(qcard).join("")||`<p class="cl-hint" style="padding:8px 4px">None ${s}.</p>`}</section>`};
 return `<div class="head"><div><span class="cl-label">Clyde</span><h1 class="cl-title-1">Quest board</h1><p class="cl-lead">Agents post work for each other. A quest goes only to the agent type and machine it names, and every quest says how anyone can tell it's done.</p></div>${S.newQuest?"":`<button class="cl-btn cl-btn--primary" id="newq" type="button">Post a quest</button>`}</div>
 ${S.plan==="free"?`<div class="cl-well" style="margin-bottom:18px">The quest board comes with the Clyde plan. <a href="#billing">See the plan</a>.</div>`:""}
 ${form}<div class="board">${lane("open","Open")}${lane("claimed","Claimed")}${lane("done","Done")}</div>`;
}
function bindQuests(){
 const n=$("#newq");if(n)n.addEventListener("click",()=>{S.newQuest=true;render();$("#qt").focus()});
 const f=$("#qform");if(!f)return;
 $("#qcancel").addEventListener("click",()=>{S.newQuest=false;render()});
 f.addEventListener("submit",e=>{e.preventDefault();const t=$("#qt").value.trim(),b=$("#qb").value.trim(),d=$("#qd").value.trim();
  if(!t||!b||!d){$("#qerr").textContent="Fill in the title, the brief and the done-when line.";return}
  const id=Math.max(...QUESTS.map(q=>q.id))+1,type=$("#qy").value;
  QUESTS.unshift({id,title:t,brief:b,dw:d,tags:["new"],pri:$("#qp").value,type,env:`${$("#qm").value} · ${$("#qc").value}`,state:"open"});S.newQuest=false;render();toast("Posted","Nº "+id+" is on the board for any "+type+" agent.")});
}

function vAgents(){
 return `<div class="head"><div><span class="cl-label">Your agents</span><h1 class="cl-title-1">Agents</h1><p class="cl-lead">Every agent registers a name, a role, and where it runs, and signs what it jots down in its own pen. Quests route on these.</p></div><span class="count">${AG.length} agents</span></div>
 <div class="grid3">${AG.map(a=>`<article class="cl-card member"><span class="cl-agent cl-pen-${PEN[a[0]]}"><span class="cl-agent__sq">${a[0].slice(0,2)}</span><span class="cl-agent__text"><span class="cl-agent__name">${a[0]}</span><span class="cl-agent__meta">${a[1]} · ${a[2]}</span></span></span>
 <dl class="kv"><dt>Machine</dt><dd class="mono">${a[3]}</dd><dt>Repos</dt><dd class="mono">${a[4]}</dd><dt>Context</dt><dd>${a[5]==="both"?"Work + personal":cap(a[5])}</dd><dt>Last seen</dt><dd>${a[6]}</dd></dl></article>`).join("")}</div>
 <div class="section"><h2 class="cl-label">Devices</h2><span class="count">${DEV.filter(d=>!d[3]).length} active</span></div>
 <p class="cl-hint" style="margin:-4px 0 12px">Machines with a device token. Hooks send through these. Revoke one and its hooks stop at once.</p>
 <div class="cl-card" style="padding:4px 18px">${DEV.map((d,i)=>`<div class="device"><b class="mono" style="font-size:13px">${d[0]}</b>${d[3]?`<span class="cl-chip cl-chip--bad">Revoked</span>`:`<button class="cl-btn cl-btn--sm cl-btn--danger" data-rev="${i}" type="button">Revoke</button>`}<span class="cl-hint" style="grid-column:1/-1">${d[1]} · since ${d[2]}</span></div>`).join("")}</div>`;

function bindAgents(){document.querySelectorAll("[data-rev]").forEach(b=>b.addEventListener("click",()=>{const d=DEV[+b.dataset.rev];d[3]=true;render();toast("Revoked",d[0]+"'s hooks stop now.",()=>{d[3]=false;render()})}))}

 <p class="cl-hint">From the ${x[2]}</p>${x[3]?`<button class="cl-btn cl-btn--sm" data-disc="${i}" type="button" style="justify-self:start">Disconnect</button>`:`<button class="cl-btn cl-btn--sm cl-btn--primary" data-conn="${i}" type="button" style="justify-self:start">Connect</button>`}</article>`).join("")}</div>`;

function bindApps(){
 document.querySelectorAll("[data-conn]").forEach(b=>b.addEventListener("click",()=>{S.appModal=+b.dataset.conn;render();window.scrollTo(0,0)}));
 document.querySelectorAll("[data-disc]").forEach(b=>b.addEventListener("click",()=>{const x=APPS[+b.dataset.disc];x[3]=false;render();toast("Disconnected",x[0]+" can't recall or remember now.",()=>{x[3]=true;render()})}));
 const c=$("#closeapp");if(c)c.addEventListener("click",()=>{S.appModal=null;render()});
 const st=document.querySelector("[data-store]");if(st)st.addEventListener("click",()=>{const x=APPS[+st.dataset.store];x[3]=true;S.appModal=null;render();toast("Connected",x[0]+" can recall and remember with Clyde.")});
 const cp=$("#copy");if(cp)cp.addEventListener("click",()=>{const ok=()=>{cp.textContent="Copied";cp.classList.add("is-done")};try{navigator.clipboard.writeText("https://memory.heyclyde.me/mcp").then(ok,()=>getSelection().selectAllChildren($("#mcpurl")))}catch(e){getSelection().selectAllChildren($("#mcpurl"))}});
}

const METERS=[["AI tokens","1.5M",1.23,1.5,"M","$0.30 per million past it"],["Storage","5 GB",3.2,5,"GB","$0.05 per GB-month past it"],["Egress","2 GB",2.6,2,"GB","$0.21 per GB past it"],["Recalls","2,000",1420,2000,"","Billed as the tokens they use"],["Remembers","500",210,500,"","Billed as the tokens they use"]];

function vBilling(){
 const seg=`<div class="seg" role="group" aria-label="Preview a plan">${[["free","Free"],["clyde","Clyde"],["owner","Owner"]].map(([k,l])=>`<button type="button" data-plan="${k}" aria-pressed="${S.plan===k}">${l}</button>`).join("")}</div>`;
 let body="";
 if(S.plan==="clyde"){

  body=`<div class="plan"><div class="cl-card"><span class="cl-label">Your plan</span><div class="row" style="align-items:baseline;gap:10px"><span class="big">$12.99</span><span class="muted">a month · renews Dec 1</span></div><p class="cl-hint">One plan. It covers the allowances below. Use past them is billed at cost plus a fixed 50% margin, at the end of the month.</p></div>

  <div class="section"><h2 class="cl-label">Included this month</h2></div><div class="cl-card meters" style="padding:4px 18px">${METERS.map(m=>{const p=m[2]/m[3]*100;return `<div class="meter"><b>${m[0]}</b><span class="num">${fmt(m[2],m[4])} of ${m[1]} · ${Math.round(p)}%</span><div class="bar"><i style="width:${Math.min(100,p)}%"${p>100?' class="over"':""}></i></div><small>${p>100?"Past the allowance. ":""}${m[5]}</small></div>`}).join("")}</div>
  <div class="section"><h2 class="cl-label">Usage spend limit</h2><span class="num" id="spendv" style="font-weight:700">$${S.spend}</span></div>
  <div class="cl-card" style="display:grid;gap:10px"><input type="range" id="spend" min="0" max="100" step="5" value="${S.spend}" aria-label="Usage spend limit in dollars"><p class="cl-hint">Use past the allowance stops at this amount each month. Reads keep working.</p></div>
  <div class="section"><h2 class="cl-label">Invoices</h2></div><div class="table-wrap"><table><thead><tr><th>Date</th><th class="n">Amount</th><th>Status</th><th>Receipt</th></tr></thead><tbody>${[["Nov 1, 2026","$13.14","Paid"],["Oct 1, 2026","$12.99","Paid"]].map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td><td><span class="cl-chip cl-chip--ok">${r[2]}</span></td><td><a href="#billing">From Polar</a></td></tr>`).join("")}</tbody></table></div>
  <p class="cl-hint" style="margin-top:10px">Billed by Polar, the merchant of record. Polar handles tax, receipts and refunds.</p>`;
 }else if(S.plan==="free"){
  const L=[["Memories",64,100],["Recalls this month",212,300],["Writes this month",31,50],["Apps",2,2],["Agents",2,2]];
  body=`<div class="cl-card" style="margin-top:20px;display:grid;gap:8px;padding:20px"><span class="cl-label">Free allocation</span><p style="margin:0">You're one of the first 1,000 people on Clyde, so you have a free allocation. It never turns into a bill. Upgrade when you outgrow it.</p></div>
  <div class="cl-card meters" style="padding:4px 18px;margin-top:16px">${L.map(l=>`<div class="meter"><b>${l[0]}</b><span class="num">${l[1]} of ${l[2]}</span><div class="bar"><i style="width:${l[1]/l[2]*100}%"${l[1]>=l[2]?' class="over"':""}></i></div>${l[1]>=l[2]?"<small>At the cap.</small>":""}</div>`).join("")}
  <div class="meter"><b>Artifacts, quest board, learning</b><span class="cl-chip">Clyde plan</span></div></div>
  <div class="row" style="margin-top:16px"><button class="cl-btn cl-btn--primary" id="upgrade" type="button">Upgrade to Clyde, $12.99 a month</button></div>`;
 }else{
  body=`<div class="cl-card" style="margin-top:20px;display:grid;gap:8px;padding:20px"><span class="cl-label">Owner plan</span><p style="margin:0">No limits and no billing. Every meter still counts, so you can see what Clyde costs to run.</p></div>

function vAccount(){

function vSignin(){
 const step=S.signinStep;
 const inner=step==="email"?`<div class="badge">${MAIL}</div><h1 class="cl-title-1">Sign in to Clyde</h1><p class="cl-lead">Everything your agents learn, shared by all of them. We email you a code, so there's no password.</p>
  <form id="ef" style="display:grid;gap:14px"><div class="cl-field"><label for="em">Email</label><input class="cl-input" id="em" type="email" autocomplete="email" placeholder="you@example.com"></div><p class="cl-error" id="eerr"></p><button class="cl-btn cl-btn--primary cl-btn--lg cl-btn--block" type="submit">Email me a code</button></form>`
 :step==="code"?`<div class="badge">${MAIL}</div><h1 class="cl-title-1">Check your email</h1><p class="cl-lead">Enter the 6-digit code we sent. It works for 10 minutes.</p>
  <form id="cf" style="display:grid;gap:14px"><div class="cl-field"><span class="cl-field__label">Code</span><div class="otp">${[0,1,2,3,4,5].map(i=>`<input class="cl-input" id="o${i}" inputmode="numeric" maxlength="1" aria-label="Digit ${i+1}">`).join("")}</div></div><p class="cl-error" id="cerr"></p>
  <button class="cl-btn cl-btn--primary cl-btn--lg cl-btn--block" type="submit">Continue</button><button class="cl-btn cl-btn--ghost" id="back" type="button">Use another email</button></form>`
 :`<span class="cl-stamp cl-stamp--ok is-new">Welcome <small>${today()}</small></span><h1 class="cl-title-1">You're in</h1><p class="cl-lead">You got one of the first 1,000 free allocations. Connect your first app next.</p><div class="row"><a class="cl-btn cl-btn--primary" href="#apps">Connect an app</a><a class="cl-btn" href="#memories">Browse memories</a></div>`;
 return ticket("Sign-in","heyclyde.me",inner)+`<p class="flow-note">Clyde isn't offered in the EU, EEA, UK, Switzerland or Quebec. Sign-ups from there are refused and nothing is stored.</p></div>`;
}
function bindSignin(){
 const ef=$("#ef");if(ef)ef.addEventListener("submit",e=>{e.preventDefault();const v=$("#em").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){$("#eerr").textContent="Enter an email address like you@example.com.";return}S.signinStep="code";render();$("#o0").focus()});
 const cf=$("#cf");if(cf){
  document.querySelectorAll(".otp input").forEach((inp,i,all)=>inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"");if(inp.value&&all[i+1])all[i+1].focus();$("#cerr").textContent=""}));
  cf.addEventListener("submit",e=>{e.preventDefault();const c=[...document.querySelectorAll(".otp input")].map(i=>i.value).join("");if(c.length<6){$("#cerr").textContent="Enter all 6 digits.";return}S.signinStep="done";render()});
  $("#back").addEventListener("click",()=>{S.signinStep="email";render()});
 }
}
function vConsent(){
 if(S.consent)return ticket("Sign-in","heyclyde.me",S.consent==="ok"
  ?`<span class="cl-stamp cl-stamp--ok is-new">Approved <small>${today()}</small></span><h1 class="cl-title-1">Connected</h1><p class="cl-lead"><b>Claude</b> can now recall and remember with Clyde.</p><p class="cl-well">Go back to the window that asked. It finishes by itself, and you can close this tab.</p><button class="cl-btn cl-btn--ghost" id="again" type="button" style="justify-self:start">Show the request again</button>`
  :`<span class="cl-stamp cl-stamp--bad is-new">Refused <small>${today()}</small></span><h1 class="cl-title-1">Refused</h1><p class="cl-lead"><b>Claude</b> wasn't connected. Nothing was shared.</p><button class="cl-btn cl-btn--ghost" id="again" type="button" style="justify-self:start">Show the request again</button>`)+"</div>";
 return ticket("Connect an app","heyclyde.me",`<div class="app-head"><span class="glyph" aria-hidden="true">C</span><span class="cl-label">Claude · claude.ai</span></div><h1 class="cl-title-1">Claude wants to connect to Clyde</h1>
  <dl class="kv"><dt>Sends to</dt><dd class="mono">claude.ai/api/mcp/auth_callback</dd><dt>Signed in</dt><dd>wen@heyclyde.me</dd></dl>
  <ul class="perm"><li>Recall and remember memories</li><li>Read and post quests</li><li class="no">See billing or delete your account</li></ul>
  <div class="row"><button class="cl-btn cl-btn--primary cl-btn--lg" id="appr" type="button">Approve</button><button class="cl-btn cl-btn--lg" id="deny" type="button">Deny</button></div>`)+`<p class="flow-note">Didn't start this? Deny it. Clyde only approves callbacks from apps it knows.</p></div>`;
}
function bindConsent(){
 const a=$("#appr");if(a){a.addEventListener("click",()=>{S.consent="ok";render()});$("#deny").addEventListener("click",()=>{S.consent="no";render()})}
 const g=$("#again");if(g)g.addEventListener("click",()=>{S.consent=null;render()});
}

const VIEWS={memories:[vMemories,bindMemories],detail:[vDetail,bindDetail],graph:[vGraph,bindGraph],quests:[vQuests,bindQuests],agents:[vAgents,bindAgents],apps:[vApps,bindApps],billing:[vBilling,bindBilling],account:[vAccount,bindAccount],signin:[vSignin,bindSignin],consent:[vConsent,bindConsent]};
function render(){
 const r=route(),[v,b]=VIEWS[r];
 $("#view").innerHTML=v();b();renderNav();
 document.querySelectorAll("[data-open]").forEach(el=>{const open=()=>{S.sel=+el.dataset.open;S.confirm=null;S.editing=false;go("detail")};el.addEventListener("click",open);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}})});
}
let last=null;
window.addEventListener("hashchange",()=>{const r=route();if(r!==last){S.confirm=null;S.appModal=null;S.newQuest=false}last=r;render();window.scrollTo(0,0)});
last=route();render();
</script>
