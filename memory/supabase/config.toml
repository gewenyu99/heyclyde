# The Supabase CLI's view of memory. Only the function's settings matter here: the project lives in the cloud.
project_id = "memory"

[functions.memory]
# The function checks its own bearer tokens (auth.ts), so Supabase's JWT gate stays off.
verify_jwt = false


# The installer signs a new computer in through Supabase's default sign-in email. The link lands on the function's
# /install/approve, and the installer finishes the PKCE exchange itself, so the link alone signs nobody in. The function
# mints a device token only for an email in memory.allowed_email. Sign-ups are off: memory is allowlist only, and the
# accounts that exist were added on purpose.
[auth]
enable_signup = false
site_url = "https://wlhlncmgjqyidosunugv.supabase.co/functions/v1/memory"
additional_redirect_urls = [
  "https://wlhlncmgjqyidosunugv.supabase.co/functions/v1/memory/install/approve**",
  "https://wlhlncmgjqyidosunugv.supabase.co/functions/v1/memory/oauth/approve**",
]

# claude.ai and other MCP clients sign in through Supabase Auth's OAuth 2.1 server. Clients register themselves, so
# adding memory as a connector takes only its URL. Supabase sends the owner to site_url + /oauth/consent, where the
# function emails the sign-in link and approves only clients whose callback is Claude's or on this computer (oauth.ts).
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true
