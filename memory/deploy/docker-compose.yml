# The memory server on one 4 GiB Droplet. Memory limits leave room for the OS and 2 GB of swap.
name: kb

services:
  db:
    build: ../db
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: kb
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kb", "-d", "kb"]
      interval: 5s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.2
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes: [ollama:/root/.ollama]
    mem_limit: 2g
    restart: unless-stopped

  api:
    build: ../api
    environment:
      DATABASE_URL: postgresql://kb:${PG_PASSWORD}@db:5432/kb
      KB_TOKEN: ${KB_TOKEN:?set KB_TOKEN in .env}
      KB_ARMS: ${KB_ARMS:-index,hybrid}
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: bge-m3
      OPEN_AI: ${OPEN_AI:-}
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_started}
    mem_limit: 384m
    restart: unless-stopped

  caddy:
    image: caddy:2.10
    environment:
      KB_DOMAIN: ${KB_DOMAIN:?set KB_DOMAIN in .env}
    ports: ["443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [api]
    mem_limit: 128m
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
  caddy:
